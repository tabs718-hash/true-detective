name: Check game
"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_checks:
        description: 'Вручную запустить браузерные проверки'
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 tests/validate_case_spec.py
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: github.event_name == 'workflow_dispatch' && inputs.browser_checks
      - run: npm run test:e2e
        if: github.event_name == 'workflow_dispatch' && inputs.browser_checks
      - name: Show browser failure context
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.browser_checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('test-results').rglob('error-context.md'):
              print(path.read_text(encoding='utf-8'))
          PY
      - uses: actions/upload-artifact@v4
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.browser_checks
        with:
          name: browser-test-results
          path: test-results/
